apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Anandprakashh/gitops.git
    targetRevision: main
    path: .
    helm:
      chart: charts/external-dns
      valueFiles:
        - apps/external-dns/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
